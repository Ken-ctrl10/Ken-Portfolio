    <!--
      Fonts via <link> rather than a CSS @import: an @import inside global.css
      cannot begin downloading until that stylesheet has been fetched and parsed,
      which serialises two round trips before any text can render.
      Roboto is requested at the four weights actually used instead of the full
      100-900 italic variable range.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Koulen&family=Roboto:wght@400;500;600;700&display=swap"
    />

    <!--
      Applies the saved colour scheme before the app bundle runs, so a returning
      dark-mode visitor never sees a flash of the light theme. Keys and class
      names match the MUI theme's colorSchemeSelector (".%s-mode"), so
      useColorScheme() stays in sync with whatever this sets.
    -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("mui-mode") || "system";
          var scheme =
            mode === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : mode;
          document.documentElement.classList.add(scheme + "-mode");
        } catch (e) {
          // Private mode or blocked storage: fall back to the light default.
          document.documentElement.classList.add("light-mode");
        }
      })();
    </script>

    <script type="module" src="/src/main.jsx" defer></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
